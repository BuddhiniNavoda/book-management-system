name: Book Management CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate AWS Secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || \
            [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] || \
            [ -z "${{ secrets.AWS_REGION }}" ] || \
            [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ] || \
            [ -z "${{ secrets.ECR_REPOSITORY }}" ]; then

            echo "Missing required GitHub secrets"
            exit 1
          fi

          echo "All required secrets exist"

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug AWS Variables
        run: |
          echo "AWS_REGION=${{ secrets.AWS_REGION }}"
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}"
          echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}"

      ##################################################
      # Build Backend Image
      ##################################################
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:backend \
            ./book-management-system

      ##################################################
      # Build Frontend Image
      ##################################################

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:frontend \
            ./book-ui

      ##################################################
      # Push Backend Image
      ##################################################

      - name: Push Backend Image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:backend

      ##################################################
      # Push Frontend Image
      ##################################################

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:frontend

      ##################################################
      # Verify Images
      ##################################################

      - name: Show Docker Images
        run: docker images