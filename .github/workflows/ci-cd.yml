name: Book Management CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    #2 .Install AWS credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRETE_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
      
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 3. Set up Docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Build & Push backend image
    - name: Build and Push Backend
      env:
        REGISTRY: ${{ secrets.ECR_REGISTRY }}
        REPOSITORY: ${{ secrets.ECR_REPO}}
        IMAGE_TAG: latest
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./book-management-system
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

    # 5. Build & Push frontend image
    - name: Build and Push Frontend
      env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
      run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./book-ui
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

    # 6. Run docker compose (test build)
    - name: Run containers
      run: docker compose up -d

    # 7. Check running containers
    - name: Verify containers
      run: docker ps

