name: Book Management CI/CD

on:
  push:
    branches:
      - main

jobs:

  ##################################################
  # BUILD AND PUSH DOCKER IMAGES
  ##################################################

  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Validate required AWS secrets
      - name: Validate AWS Secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || \
             [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] || \
             [ -z "${{ secrets.AWS_REGION }}" ] || \
             [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ] || \
             [ -z "${{ secrets.ECR_REPOSITORY }}" ]; then

            echo "Missing required GitHub secrets"
            exit 1
          fi

          echo "All required secrets exist"

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Debug non-sensitive AWS variables
      - name: Debug AWS Variables
        run: |
          echo "AWS_REGION=${{ secrets.AWS_REGION }}"
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}"
          echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}"

      ##################################################
      # BUILD BACKEND IMAGE
      ##################################################

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:backend \
            ./book-management-system

      ##################################################
      # BUILD FRONTEND IMAGE
      ##################################################

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:frontend \
            ./book-ui

      ##################################################
      # PUSH BACKEND IMAGE
      ##################################################

      - name: Push Backend Image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:backend

      ##################################################
      # PUSH FRONTEND IMAGE
      ##################################################

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:frontend

      ##################################################
      # VERIFY IMAGES
      ##################################################

      - name: Show Docker Images
        run: docker images


  ##################################################
  # DEPLOY TO EC2
  ##################################################

  deploy:
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_EC2 }}
          script: |
            cd /home/ubuntu
            docker compose pull
            docker compose up -d --force-recreate